<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>learn4something · 首页</title>
<style>
  :root{
    --bg:#f6f5f3;
    --card:#ffffff;
    --ink:#2b2b2b;
    --ink-2:#6b6a69;
    --line:#e2e0dd;
    --accent:#a8854a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.6;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 48px;
  }
  .wrap{width:100%;max-width:680px;}

  header{margin-bottom:22px;}
  h1{
    margin:0 0 6px;
    font-size:24px;
    letter-spacing:.5px;
  }
  .sub{margin:0;color:var(--ink-2);font-size:14px;}

  ul.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
  ul.cards a{
    display:block;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    text-decoration:none;
    color:inherit;
    transition:border-color .15s, transform .15s, box-shadow .15s;
  }
  ul.cards a:hover{
    border-color:var(--accent);
    transform:translateY(-1px);
    box-shadow:0 3px 10px rgba(0,0,0,.06);
  }
  .row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .t{font-size:17px;font-weight:600;}
  .tag{
    font-size:11px;color:var(--accent);
    border:1px solid var(--accent);border-radius:999px;
    padding:1px 8px;line-height:1.6;
  }
  .d{margin-top:6px;font-size:14px;color:var(--ink-2);}
  .f{margin-top:4px;font-size:12px;color:#9a9896;word-break:break-all;}

  footer{
    margin-top:28px;padding-top:14px;
    border-top:1px solid var(--line);
    font-size:12px;color:#9a9896;
  }
  footer code{background:#eee;color:var(--ink-2);padding:1px 5px;border-radius:4px;}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>learn4something</h1>
    <p class="sub">随手做的学习小页面，点开就能玩 / 能看。</p>
  </header>

  <ul class="cards">
    <li>
      <a href="%E5%8F%A4%E5%85%B8%E5%90%8D%E5%8F%A5%E5%B0%8F%E6%B8%B8%E6%88%8F.html">
        <span class="row"><span class="t">经典拼句</span><span class="tag">小游戏</span></span>
        <span class="d">把《论语》《道德经》《传习录》的名句打乱，逐关拼回原句，附释义与出处。</span>
        <span class="f">古典名句小游戏.html</span>
      </a>
    </li>
    <li>
      <a href="%E7%8E%B0%E4%BB%A3C%2B%2B%E7%89%B9%E6%80%A7%E8%AF%A6%E8%A7%A3.html">
        <span class="row"><span class="t">现代 C++ 特性详解</span><span class="tag">长文</span></span>
        <span class="d">用 C 语言的视角重新理解 auto、RAII、智能指针、移动语义、模板、Concepts 等 24 个特性。</span>
        <span class="f">现代C++特性详解.html</span>
      </a>
    </li>
  </ul>

  <footer>
    新增页面：把 html 丢进仓库根目录，再在 <code>index.html</code> 的 <code>ul.cards</code> 里加一条即可（中文文件名建议用 URL 编码，和上面一致）。
  </footer>
</main>
</body>
</html>
