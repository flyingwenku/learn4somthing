<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>经典拼句</title>
<style>
  :root{
    --paper:#f4ecd8;
    --ink:#2b2b2b; --ink-light:#6b5f4a;
    --bamboo:#c9a86a; --bamboo-dark:#a8854a;
    --seal:#b03a2e; --gold:#8a6d3b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(180,160,120,.15), transparent 60%),
      radial-gradient(circle at 80% 90%, rgba(160,140,100,.12), transparent 60%),
      var(--paper);
    color:var(--ink);min-height:100vh;
    display:flex;justify-content:center;padding:16px;
  }
  .app{width:100%;max-width:640px;display:flex;flex-direction:column;gap:14px;}

  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    background:linear-gradient(180deg,#f8f1e0,#efe4cc);
    border:1px solid var(--bamboo);border-radius:10px;
    padding:10px 14px;box-shadow:0 2px 0 rgba(0,0,0,.05);
    font-size:14px;color:var(--ink-light);gap:10px;
  }
  .topbar .lv{color:var(--gold);font-weight:bold;font-size:16px;}
  .source-tag{
    font-size:12px;color:var(--ink-light);letter-spacing:1px;
    background:#efe4cc;border:1px solid var(--bamboo);
    padding:3px 12px;border-radius:12px;white-space:nowrap;
    cursor:pointer;transition:.15s;font-family:inherit;
  }
  .source-tag:hover{background:#fbf6e8;transform:translateY(-1px);}
  .source-tag::after{content:" ▾";font-size:10px;opacity:.6;}

  .answer-area{
    min-height:70px;display:flex;flex-wrap:wrap;gap:8px;
    justify-content:center;align-items:center;
    padding:14px;border-radius:12px;
    background:linear-gradient(180deg,#fbf6e8,#f1e7d0);
    border:2px dashed var(--bamboo);position:relative;
  }
  .slot{
    width:46px;height:46px;display:flex;align-items:center;justify-content:center;
    font-size:26px;color:var(--ink);
    background:#fffaf0;border:1px solid var(--bamboo);
    border-radius:6px;position:relative;
  }
  .slot.empty{background:transparent;border:1px dashed #d8c8a8;color:#c8b898;}
  .slot.filled{background:#fffaf0;border:1px solid var(--bamboo-dark);cursor:pointer;}
  .slot.filled:hover{background:#f8ecd0;}
  .slot.correct{background:#e8f3d8;border-color:#8fae6a;}
  .slot.wrong{background:#f7d9d4;border-color:var(--seal);animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  .pool{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
    padding:14px;border-radius:12px;
    background:linear-gradient(180deg,#f8f1e0,#efe4cc);
    border:1px solid var(--bamboo);min-height:80px;
  }
  .tile{
    width:46px;height:46px;display:flex;align-items:center;justify-content:center;
    font-size:26px;cursor:pointer;user-select:none;
    background:linear-gradient(180deg,#d9bd85,#c9a86a);
    color:#3a2d1a;border-radius:6px;
    border:1px solid var(--bamboo-dark);
    box-shadow:0 2px 0 var(--bamboo-dark), inset 0 1px 0 rgba(255,255,255,.4);
    transition:.15s;font-family:inherit;
  }
  .tile:hover{transform:translateY(-2px);box-shadow:0 4px 0 var(--bamboo-dark);}
  .tile:active{transform:translateY(1px);box-shadow:0 1px 0 var(--bamboo-dark);}
  .tile.used{visibility:hidden;}

  .level-nav{
    display:flex;justify-content:center;align-items:center;gap:10px;
    background:linear-gradient(180deg,#f8f1e0,#efe4cc);
    border:1px solid var(--bamboo);border-radius:12px;padding:10px 14px;
    box-shadow:0 2px 0 rgba(0,0,0,.05);flex-wrap:wrap;
  }
  .nav-btn{
    padding:8px 18px;font-size:15px;font-family:inherit;cursor:pointer;
    border-radius:8px;border:1px solid var(--bamboo-dark);
    background:linear-gradient(180deg,#f8f1e0,#e8dcc0);
    color:var(--ink);letter-spacing:1px;transition:.15s;
  }
  .nav-btn:hover{transform:translateY(-1px);background:#fbf6e8;}
  .nav-btn:active{transform:translateY(1px);}
  .nav-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .nav-btn.seal-btn{
    background:linear-gradient(180deg,#c9a86a,#a8854a);color:#fff;border-color:#8a6d3b;
  }
  .nav-btn.seal-btn:hover{background:linear-gradient(180deg,#d9bd85,#b8965a);}
  .lv-input{
    width:80px;text-align:center;font-size:18px;font-family:inherit;
    padding:6px 4px;border-radius:8px;border:1px solid var(--bamboo-dark);
    background:#fffaf0;color:var(--seal);font-weight:bold;
  }
  .lv-input:focus{outline:2px solid var(--bamboo);}
  .lv-total{font-size:13px;color:var(--ink-light);}

  .meaning{
    padding:0 14px;font-size:15px;line-height:1.7;color:var(--ink-light);
    max-height:0;overflow:hidden;opacity:0;transition:.35s;
  }
  .meaning.show{max-height:600px;opacity:1;padding:12px 14px;
    background:linear-gradient(180deg,#fbf6e8,#f1e7d0);
    border:1px solid var(--bamboo);border-radius:10px;}
  .meaning .m-quote{color:var(--seal);font-weight:bold;font-size:17px;margin-bottom:8px;text-align:center;}
  .meaning .m-full,.meaning .m-brief,.meaning .m-detail,.meaning .m-ref{
    font-size:14px;line-height:1.8;color:var(--ink-light);text-align:left;margin:6px 0;
  }
  .meaning .m-label{color:var(--gold);font-weight:bold;margin-right:4px;}

  .seal{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0) rotate(-15deg);
    width:110px;height:110px;border:4px solid var(--seal);border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:48px;color:var(--seal);font-weight:bold;
    background:rgba(255,250,240,.85);
    pointer-events:none;opacity:0;z-index:99;
    font-family:"Kaiti SC","STKaiti",serif;
  }
  .seal.show{animation:sealIn 1.1s ease forwards;}
  @keyframes sealIn{
    0%{transform:translate(-50%,-50%) scale(2) rotate(-15deg);opacity:0;}
    40%{transform:translate(-50%,-50%) scale(.95) rotate(-8deg);opacity:1;}
    60%{transform:translate(-50%,-50%) scale(1.05) rotate(-12deg);}
    100%{transform:translate(-50%,-50%) scale(1) rotate(-10deg);opacity:0;}
  }

  .toast{
    text-align:center;font-size:13px;color:var(--seal);min-height:16px;
    letter-spacing:1px;opacity:.9;
  }

  .modal{
    position:fixed;inset:0;background:rgba(40,30,20,.55);
    display:none;align-items:center;justify-content:center;z-index:200;padding:16px;
  }
  .modal.show{display:flex;}
  .modal-box{
    background:var(--paper);border:2px solid var(--bamboo-dark);
    border-radius:14px;max-width:560px;width:100%;max-height:80vh;
    display:flex;flex-direction:column;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
  }
  .modal-header{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 18px;border-bottom:1px dashed var(--bamboo);
  }
  .modal-header h2{margin:0;color:var(--gold);font-size:18px;letter-spacing:2px;}
  .modal-close{
    cursor:pointer;font-size:20px;color:var(--ink-light);
    border:none;background:none;font-family:inherit;
  }
  .modal-body{overflow:auto;padding:8px 18px 18px;}
  .chapter-item{
    border-bottom:1px dashed var(--bamboo);
    padding:12px 4px;cursor:pointer;transition:.15s;border-radius:6px;
  }
  .chapter-item:hover{background:#fbf6e8;padding-left:10px;}
  .chapter-item .c-q{color:var(--seal);font-weight:bold;font-size:16px;margin-bottom:4px;}
  .chapter-item .c-m{color:var(--ink-light);font-size:13px;line-height:1.6;}
  .chapter-item .c-lv{color:var(--gold);font-size:12px;margin-left:6px;}
  .modal-footer{
    padding:10px 18px;border-top:1px dashed var(--bamboo);
    display:flex;justify-content:center;
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>第 <span class="lv" id="lvDisplay">1</span> 关 / <span id="lvTotal">175</span></div>
    <button class="source-tag" id="sourceTag">《论语》· 为学</button>
  </div>

  <div class="answer-area" id="answerArea"></div>

  <div class="toast" id="toast"></div>

  <div class="pool" id="pool"></div>

  <div class="meaning" id="meaning"></div>

  <div class="level-nav">
    <button class="nav-btn" id="prevBtn">上一关</button>
    <input class="lv-input" id="lvInput" type="number" min="1" max="175" value="1">
    <span class="lv-total">/ <span id="lvTotal2">175</span></span>
    <button class="nav-btn" id="nextBtn">下一关</button>
    <button class="nav-btn seal-btn" id="meaningBtn" style="display:none">释义</button>
  </div>
</div>

<div class="seal" id="seal">过</div>

<div class="modal" id="chapterModal">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="chapterTitle">《论语》· 为学</h2>
      <button class="modal-close" id="closeChapter">✕</button>
    </div>
    <div class="modal-body" id="chapterList"></div>
    <div class="modal-footer">
      <button class="nav-btn" id="backToLevel">返回关卡模式</button>
    </div>
  </div>
</div>

<script>
/* ================== 题库 ================== */
const DB = [
/* ===== 论语 · 为学 ===== */
{s:"论语",c:"为学",t:"学而时习之",full:"学而时习之，不亦说乎？",m:"学习并不断实践，才是真正的快乐。",detail:"学了知识又按时去练习、实践，不也很喜悦吗？强调学习不是死记硬背，而是反复实践、落到实处，从中获得真正的快乐。",ref:"《论语·学而》"},
{s:"论语",c:"为学",t:"温故而知新",full:"温故而知新，可以为师矣。",m:"复习旧知，能生发新见。",detail:"复习旧知识时能有新体会、新发现，这样就可以做老师了。说明学习不是一次性的，旧知里藏着新意，反复咀嚼才有长进。",ref:"《论语·为政》"},
{s:"论语",c:"为学",t:"学而不思则罔",full:"学而不思则罔，思而不学则殆。",m:"只学不思考，就会迷惑无所得。",detail:"只读书不思考，就会迷惑而无所得；只空想不读书，就会疑惑而不安。学与思必须并重，缺一不可。",ref:"《论语·为政》"},
{s:"论语",c:"为学",t:"思而不学则殆",full:"学而不思则罔，思而不学则殆。",m:"只思考不学习，就会危险不安。",detail:"只空想而不读书，就会疑惑不安。思考必须以学习为基础，否则容易陷入空想和危险。",ref:"《论语·为政》"},
{s:"论语",c:"为学",t:"知之为知之",full:"知之为知之，不知为不知，是知也。",m:"知道就是知道，诚实面对认知。",detail:"知道就是知道，不知道就是不知道，这才是真正的智慧。承认自己的无知，是求知的起点；不懂装懂，才是最大的糊涂。",ref:"《论语·为政》"},
{s:"论语",c:"为学",t:"敏而好学",full:"敏而好学，不耻下问。",m:"聪慧又好学。",detail:"聪敏又爱好学习，向地位不如自己的人请教也不觉得羞耻。这是孔子对孔文子的评价，也是为学的典范态度。",ref:"《论语·公冶长》"},
{s:"论语",c:"为学",t:"不耻下问",full:"敏而好学，不耻下问。",m:"向不如自己的人请教也不羞耻。",detail:"向地位、学问不如自己的人请教也不觉得羞耻。真正的求学之心，超越身份和面子。",ref:"《论语·公冶长》"},
{s:"论语",c:"为学",t:"学而不厌",full:"默而识之，学而不厌，诲人不倦，何有于我哉？",m:"学习永不满足。",detail:"默默记住所学，学习不觉得满足，教导别人不觉得疲倦——这些我做到了哪些呢？学而不厌，是终身学习的态度。",ref:"《论语·述而》"},
{s:"论语",c:"为学",t:"诲人不倦",full:"默而识之，学而不厌，诲人不倦，何有于我哉？",m:"教导别人不嫌累。",detail:"教导别人不觉得疲倦。教与学相长，教别人的过程也是自己深化理解的过程。",ref:"《论语·述而》"},
{s:"论语",c:"为学",t:"三人行必有我师焉",full:"三人行，必有我师焉。择其善者而从之，其不善者而改之。",m:"处处皆可为师。",detail:"几个人一起走，其中必定有可以做我老师的人。看到别人的优点就学习，看到别人的缺点就反省自己有没有同样的问题。",ref:"《论语·述而》"},
{s:"论语",c:"为学",t:"择其善者而从之",full:"三人行，必有我师焉。择其善者而从之，其不善者而改之。",m:"选择好的来学习。",detail:"选择别人的优点来学习，看到别人的缺点就反省自己。学习不只是读书，更是从身边人身上学。",ref:"《论语·述而》"},
{s:"论语",c:"为学",t:"古之学者为己",full:"古之学者为己，今之学者为人。",m:"学习的根本是为了完善自己。",detail:"古人学习是为了修养自己，今人学习是为了向别人炫耀。学习的根本目的，是完善自身，而不是做给别人看。",ref:"《论语·宪问》"},

/* ===== 论语 · 修身 ===== */
{s:"论语",c:"修身",t:"吾日三省吾身",full:"吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？",m:"每日自省，是成长的起点。",detail:"我每天多次反省自己：替别人办事是否尽心？与朋友交往是否守信？老师传授的学问是否复习实践？每日自省，是成长的起点。",ref:"《论语·学而》"},
{s:"论语",c:"修身",t:"人不知而不愠",full:"人不知而不愠，不亦君子乎？",m:"不被理解也不恼怒，是君子的修养。",detail:"别人不了解我，我也不恼怒，不也是君子吗？修养到一定程度，就不会因外界误解而动摇心绪。",ref:"《论语·学而》"},
{s:"论语",c:"修身",t:"君子务本",full:"君子务本，本立而道生。",m:"根基扎实，一切自然生发。",detail:"君子致力于根本，根本确立了，做人的道理自然就生发出来。根基扎实，一切自然生长。",ref:"《论语·学而》"},
{s:"论语",c:"修身",t:"见贤思齐焉",full:"见贤思齐焉，见不贤而内自省也。",m:"向优秀看齐。",detail:"看到贤德的人就想着向他看齐，看到不贤的人就反省自己有没有同样的毛病。向优秀看齐，从反面警醒自己。",ref:"《论语·里仁》"},
{s:"论语",c:"修身",t:"见不贤而内自省也",full:"见贤思齐焉，见不贤而内自省也。",m:"从反面警醒自己。",detail:"看到不贤的人，就反省自己有没有类似的缺点。别人的过失，是自己的镜子。",ref:"《论语·里仁》"},
{s:"论语",c:"修身",t:"岁寒然后知松柏之后凋也",full:"岁寒，然后知松柏之后凋也。",m:"逆境方显品格。",detail:"到了寒冷的季节，才知道松柏是最后凋零的。比喻在逆境和考验中，才能看出一个人真正的品格。",ref:"《论语·子罕》"},
{s:"论语",c:"修身",t:"三军可夺帅也",full:"三军可夺帅也，匹夫不可夺志也。",m:"军队可以被夺去主帅。",detail:"一支军队可以被夺去主帅，但一个普通人的志向却不能被夺走。前半句是衬托，后半句才是重点。",ref:"《论语·子罕》"},
{s:"论语",c:"修身",t:"匹夫不可夺志也",full:"三军可夺帅也，匹夫不可夺志也。",m:"志向不可被剥夺。",detail:"一个普通人的志向，是外力无法夺走的。志向是人的根本，处境可以变，心志不能变。",ref:"《论语·子罕》"},
{s:"论语",c:"修身",t:"君子坦荡荡",full:"君子坦荡荡，小人长戚戚。",m:"心胸开阔。",detail:"君子心胸开阔、坦然自在；小人心胸狭隘、患得患失。心境的不同，源于修养的不同。",ref:"《论语·述而》"},
{s:"论语",c:"修身",t:"小人长戚戚",full:"君子坦荡荡，小人长戚戚。",m:"患得患失。",detail:"小人总是忧愁、患得患失。因为心里装的全是利害得失，所以不得安宁。",ref:"《论语·述而》"},
{s:"论语",c:"修身",t:"文质彬彬然后君子",full:"质胜文则野，文胜质则史。文质彬彬，然后君子。",m:"内在与修养的平衡。",detail:"质朴多于文采就显得粗野，文采多于质朴就显得虚浮。文采与质朴配合得当，才是君子。内在修养与外在表现要平衡。",ref:"《论语·雍也》"},
{s:"论语",c:"修身",t:"仁者不忧",full:"仁者不忧，知者不惑，勇者不惧。",m:"仁德的人不忧愁。",detail:"有仁德的人不忧愁，有智慧的人不迷惑，勇敢的人不畏惧。智、仁、勇，是君子的三种达德。",ref:"《论语·子罕》"},
{s:"论语",c:"修身",t:"知者不惑",full:"仁者不忧，知者不惑，勇者不惧。",m:"智慧的人不迷惑。",detail:"有智慧的人不迷惑。因为看得清楚，所以不会在纷繁的现象中迷失方向。",ref:"《论语·子罕》"},
{s:"论语",c:"修身",t:"勇者不惧",full:"仁者不忧，知者不惑，勇者不惧。",m:"勇敢的人不畏惧。",detail:"勇敢的人不畏惧。这里的勇不是莽撞，而是基于道义的坚定。",ref:"《论语·子罕》"},

/* ===== 论语 · 处世 ===== */
{s:"论语",c:"处世",t:"己所不欲勿施于人",full:"己所不欲，勿施于人。",m:"推己及人的黄金法则。",detail:"自己不愿意承受的事，就不要强加给别人。这是推己及人的处世黄金法则，也是儒家“仁”的核心实践。",ref:"《论语·卫灵公》"},
{s:"论语",c:"处世",t:"己欲立而立人",full:"己欲立而立人，己欲达而达人。",m:"成就自己也成就他人。",detail:"自己想要立得住，也让别人立得住；自己想要通达，也让别人通达。成就自己的同时成就他人。",ref:"《论语·雍也》"},
{s:"论语",c:"处世",t:"己欲达而达人",full:"己欲立而立人，己欲达而达人。",m:"自己通达也让别人通达。",detail:"自己希望通达，也帮助别人通达。这是“仁”的积极面，与“己所不欲勿施于人”一正一反。",ref:"《论语·雍也》"},
{s:"论语",c:"处世",t:"君子和而不同",full:"君子和而不同，小人同而不和。",m:"和谐但不盲从。",detail:"君子能与人和睦相处，但保持自己的独立见解；小人一味附和，内心却并不和谐。真正的和谐，不是抹平差异，而是求同存异。",ref:"《论语·子路》"},
{s:"论语",c:"处世",t:"小人同而不和",full:"君子和而不同，小人同而不和。",m:"盲从但不和谐。",detail:"小人表面上一味附和，内心却各怀私利，并不真正和谐。盲从不是和谐。",ref:"《论语·子路》"},
{s:"论语",c:"处世",t:"躬自厚而薄责于人",full:"躬自厚而薄责于人，则远怨矣。",m:"多责己、少责人。",detail:"多责备自己，少责备别人，怨恨自然就远离了。遇事反求诸己，是化解矛盾的根本方法。",ref:"《论语·卫灵公》"},
{s:"论语",c:"处世",t:"君子求诸己",full:"君子求诸己，小人求诸人。",m:"遇事反求诸己。",detail:"君子遇到问题从自己身上找原因，小人遇到问题从别人身上找原因。这一念之差，是君子与小人的分水岭。",ref:"《论语·卫灵公》"},
{s:"论语",c:"处世",t:"小人求诸人",full:"君子求诸己，小人求诸人。",m:"遇事推卸责任。",detail:"小人遇到问题总是责怪别人、推卸责任。把责任推出去，自己也就失去了成长的机会。",ref:"《论语·卫灵公》"},
{s:"论语",c:"处世",t:"德不孤必有邻",full:"德不孤，必有邻。",m:"有德行的人不会孤单。",detail:"有道德的人不会孤单，一定会有志同道合的人来亲近他。德行本身就是感召力。",ref:"《论语·里仁》"},
{s:"论语",c:"处世",t:"言忠信行笃敬",full:"言忠信，行笃敬，虽蛮貊之邦行矣。",m:"言行忠信敬。",detail:"说话忠诚守信，做事笃实恭敬，即使到了蛮荒之地也能行得通。忠信笃敬，是走遍天下的通行证。",ref:"《论语·卫灵公》"},
{s:"论语",c:"处世",t:"友直友谅友多闻",full:"益者三友，损者三友：友直，友谅，友多闻，益矣。",m:"益者三友的标准。",detail:"有益的朋友有三种：正直的朋友、诚信的朋友、见闻广博的朋友。与这样的人交往，自己也会受益。",ref:"《论语·季氏》"},

/* ===== 论语 · 为政 ===== */
{s:"论语",c:"为政",t:"为政以德",full:"为政以德，譬如北辰，居其所而众星共之。",m:"以德行来治理。",detail:"以道德来治理国家，就像北极星一样，安处自己的位置，群星都环绕着它。说明德治的感召力远胜于强制。",ref:"《论语·为政》"},
{s:"论语",c:"为政",t:"譬如北辰居其所而众星共之",full:"为政以德，譬如北辰，居其所而众星共之。",m:"德行的感召力。",detail:"像北极星那样安居其位，群星自然环绕。领导者德行端正，众人自然归附。",ref:"《论语·为政》"},
{s:"论语",c:"为政",t:"敬事而信",full:"道千乘之国，敬事而信，节用而爱人，使民以时。",m:"认真做事，讲究信用。",detail:"治理一个大国，要认真处理政事、讲究信用、节约用度、爱护他人、役使百姓不误农时。这是治理的朴素智慧。",ref:"《论语·学而》"},
{s:"论语",c:"为政",t:"节用而爱人",full:"道千乘之国，敬事而信，节用而爱人，使民以时。",m:"节约用度，爱护他人。",detail:"节约财政开支，爱护百姓。治理的根本，是珍惜民力、不折腾。",ref:"《论语·学而》"},
{s:"论语",c:"为政",t:"使民以时",full:"道千乘之国，敬事而信，节用而爱人，使民以时。",m:"役使百姓要不误农时。",detail:"役使百姓要在农闲时节，不误农时。这是古代最朴素的“以民为本”。",ref:"《论语·学而》"},
{s:"论语",c:"为政",t:"不在其位不谋其政",full:"不在其位，不谋其政。",m:"各安其分，各司其职。",detail:"不在那个职位上，就不去谋划那个职位上的政事。各安其分、各司其职，是秩序的基础。",ref:"《论语·泰伯》"},
{s:"论语",c:"为政",t:"逝者如斯夫",full:"逝者如斯夫！不舍昼夜。",m:"时间如流水。",detail:"消逝的时光就像这河水一样，日夜不停地流去。孔子在河边感叹，提醒人珍惜当下。",ref:"《论语·子罕》"},
{s:"论语",c:"为政",t:"不舍昼夜",full:"逝者如斯夫！不舍昼夜。",m:"日夜不停。",detail:"日夜不停歇。时间不会为任何人停留，唯有珍惜。",ref:"《论语·子罕》"},
{s:"论语",c:"为政",t:"饭疏食饮水",full:"饭疏食饮水，曲肱而枕之，乐亦在其中矣。",m:"吃粗粮喝冷水。",detail:"吃粗粮、喝冷水，弯着胳膊当枕头，快乐也在其中。安贫乐道，是孔颜之乐的核心。",ref:"《论语·述而》"},
{s:"论语",c:"为政",t:"曲肱而枕之",full:"饭疏食饮水，曲肱而枕之，乐亦在其中矣。",m:"弯着胳膊当枕头。",detail:"弯着胳膊当枕头，形容生活简朴。物质虽简，内心却充实快乐。",ref:"《论语·述而》"},
{s:"论语",c:"为政",t:"不义而富且贵",full:"不义而富且贵，于我如浮云。",m:"不义得来的富贵。",detail:"用不正当手段得来的富贵，对我来说就像天上的浮云一样。安贫乐道，不为外物所役。",ref:"《论语·述而》"},
{s:"论语",c:"为政",t:"于我如浮云",full:"不义而富且贵，于我如浮云。",m:"对我像浮云一样。",detail:"不义而来的富贵，对我如同浮云，无足轻重。这是孔子对物质诱惑的态度。",ref:"《论语·述而》"},

/* ===== 道德经 · 道与德 ===== */
{s:"道德经",c:"道与德",t:"道可道非常道",full:"道可道，非常道；名可名，非常名。",m:"能说出来的道，就不是永恒的道。",detail:"可以用言语说出来的道，就不是永恒不变的道；可以用名称叫出来的名，就不是永恒不变的名。语言有边界，而道无边界。老子开篇即点明：终极真理超越语言。",ref:"《道德经》第一章"},
{s:"道德经",c:"道与德",t:"名可名非常名",full:"道可道，非常道；名可名，非常名。",m:"能叫得出的名，就不是永恒的名。",detail:"可以用名称叫出来的名，就不是永恒不变的名。任何命名都是人为的限定，而道本身无法被限定。",ref:"《道德经》第一章"},
{s:"道德经",c:"道与德",t:"天下皆知美之为美",full:"天下皆知美之为美，斯恶已；皆知善之为善，斯不善已。",m:"天下都知道美之所以为美。",detail:"天下人都知道美之所以为美，丑的观念就随之产生了；都知道善之所以为善，不善的观念也就随之产生了。美丑、善恶都是相对而立，没有绝对标准。",ref:"《道德经》第二章"},
{s:"道德经",c:"道与德",t:"上善若水",full:"上善若水。水善利万物而不争，处众人之所恶，故几于道。",m:"最高境界的善像水。",detail:"最高的善像水一样。水滋养万物却不与万物相争，停留在众人厌恶的低处，所以最接近于道。水的品格，就是老子推崇的处世之道。",ref:"《道德经》第八章"},
{s:"道德经",c:"道与德",t:"水善利万物而不争",full:"上善若水。水善利万物而不争，处众人之所恶，故几于道。",m:"水滋养万物却不争。",detail:"水滋养万物，却不与万物争高下。不争，不是软弱，而是因为深知“柔弱胜刚强”。",ref:"《道德经》第八章"},
{s:"道德经",c:"道与德",t:"处众人之所恶",full:"上善若水。水善利万物而不争，处众人之所恶，故几于道。",m:"停留在众人厌恶的地方。",detail:"水总是流向低处，停留在众人厌恶的低洼之地。甘居下位，反而最接近道。",ref:"《道德经》第八章"},
{s:"道德经",c:"道与德",t:"故几于道",full:"上善若水。水善利万物而不争，处众人之所恶，故几于道。",m:"所以接近于道。",detail:"因为水有这些品格，所以最接近于道。老子以水喻道，是因为水最能体现“柔、下、不争”。",ref:"《道德经》第八章"},
{s:"道德经",c:"道与德",t:"道生一一生二",full:"道生一，一生二，二生三，三生万物。",m:"道生一，一生二。",detail:"道生出一，一生出二，二生出三，三生出万物。这是老子对宇宙生成逻辑的概括，从无到有、从简到繁。",ref:"《道德经》第四十二章"},
{s:"道德经",c:"道与德",t:"二生三三生万物",full:"道生一，一生二，二生三，三生万物。",m:"二生三，三生万物。",detail:"由二生出三，由三生出万物。万物虽繁，其源则一。",ref:"《道德经》第四十二章"},
{s:"道德经",c:"道与德",t:"人法地地法天",full:"人法地，地法天，天法道，道法自然。",m:"人取法地，地取法天。",detail:"人取法于地，地取法于天，天取法于道，道取法于自然。层层递进，最终归于“自然”——本来如此。",ref:"《道德经》第二十五章"},
{s:"道德经",c:"道与德",t:"天法道道法自然",full:"人法地，地法天，天法道，道法自然。",m:"天取法道，道取法自然。",detail:"天取法于道，道取法于自然。自然不是自然界，而是“自己如此、本来如此”的状态，是终极法则。",ref:"《道德经》第二十五章"},
{s:"道德经",c:"道与德",t:"有物混成先天地生",full:"有物混成，先天地生。",m:"道在天地之前就存在了。",detail:"有一个混然一体的东西，在天地形成之前就已经存在。老子用它来描述道——先于天地、独立不改、周行不殆。",ref:"《道德经》第二十五章"},
{s:"道德经",c:"道与德",t:"反者道之动",full:"反者道之动，弱者道之用。",m:"道的运动是循环往复。",detail:"向相反的方向运动，是道的运动规律；以柔弱的方式发挥作用，是道的运用方式。物极必反，柔能克刚。",ref:"《道德经》第四十章"},
{s:"道德经",c:"道与德",t:"弱者道之用",full:"反者道之动，弱者道之用。",m:"道的作用是以柔克刚。",detail:"道以柔弱的方式发挥作用。看似柔弱，实则无坚不摧。",ref:"《道德经》第四十章"},

/* ===== 道德经 · 修身 ===== */
{s:"道德经",c:"修身",t:"知人者智",full:"知人者智，自知者明。",m:"了解别人是聪明。",detail:"能了解别人，是聪明；能了解自己，才是真正的高明。向外看容易，向内看难。",ref:"《道德经》第三十三章"},
{s:"道德经",c:"修身",t:"自知者明",full:"知人者智，自知者明。",m:"认识自己才是高明。",detail:"认识自己，才是真正的高明。人最难的不是看清别人，而是看清自己。",ref:"《道德经》第三十三章"},
{s:"道德经",c:"修身",t:"胜人者有力",full:"胜人者有力，自胜者强。",m:"打败别人靠力量。",detail:"能战胜别人，说明有力量；能战胜自己，才是真正的强大。",ref:"《道德经》第三十三章"},
{s:"道德经",c:"修身",t:"自胜者强",full:"胜人者有力，自胜者强。",m:"战胜自己才是真正的强者。",detail:"战胜自己的欲望、习气、恐惧，才是真正的强者。向外战胜一千人，不如向内战胜自己一次。",ref:"《道德经》第三十三章"},
{s:"道德经",c:"修身",t:"知足不辱",full:"知足不辱，知止不殆，可以长久。",m:"知道满足不招辱。",detail:"知道满足，就不会招致屈辱；知道适可而止，就不会遭遇危险。如此才能长久。",ref:"《道德经》第四十四章"},
{s:"道德经",c:"修身",t:"知止不殆",full:"知足不辱，知止不殆，可以长久。",m:"知道停手不遇险。",detail:"知道什么时候该停手，就不会陷入危险。贪进不知止，是取祸之道。",ref:"《道德经》第四十四章"},
{s:"道德经",c:"修身",t:"可以长久",full:"知足不辱，知止不殆，可以长久。",m:"这样才可以长久。",detail:"知足、知止，才能长久。这是老子对人生安稳的总结。",ref:"《道德经》第四十四章"},
{s:"道德经",c:"修身",t:"致虚极守静笃",full:"致虚极，守静笃。",m:"把内心清空到极致，守住深沉的安静。",detail:"让内心虚空到极点，让安静守持到笃实。虚则能容，静则能观，这是老子修身的根本功夫。",ref:"《道德经》第十六章"},
{s:"道德经",c:"修身",t:"知常曰明",full:"知常曰明。不知常，妄作凶。",m:"懂得规律叫明白。",detail:"懂得万物运行的常道，就叫明白。不懂常道而轻举妄动，就会招来凶险。",ref:"《道德经》第十六章"},
{s:"道德经",c:"修身",t:"不知常妄作凶",full:"知常曰明。不知常，妄作凶。",m:"不懂规律乱来会遭殃。",detail:"不懂得规律而胡乱作为，必然招致凶险。顺应规律，是老子一再强调的。",ref:"《道德经》第十六章"},
{s:"道德经",c:"修身",t:"含德之厚比于赤子",full:"含德之厚，比于赤子。",m:"德行深厚的人，像婴儿一样纯粹。",detail:"德行涵养深厚的人，就像初生的婴儿一样纯粹。婴儿无欲无求、精气充足，是老子推崇的生命状态。",ref:"《道德经》第五十五章"},
{s:"道德经",c:"修身",t:"见素抱朴",full:"见素抱朴，少私寡欲。",m:"保持朴素本色。",detail:"显现本色，持守朴素；减少私心，降低欲望。回归本真，是老子修身的核心。",ref:"《道德经》第十九章"},
{s:"道德经",c:"修身",t:"少私寡欲",full:"见素抱朴，少私寡欲。",m:"减少私心贪念。",detail:"减少私心，降低欲望。欲望越多，内心越乱；少私寡欲，才能回归安宁。",ref:"《道德经》第十九章"},
{s:"道德经",c:"修身",t:"信言不美",full:"信言不美，美言不信。",m:"真话不好听。",detail:"真实的话往往不漂亮，漂亮的话往往不真实。老子提醒人：不要被言辞的华美所迷惑。",ref:"《道德经》第八十一章"},
{s:"道德经",c:"修身",t:"美言不信",full:"信言不美，美言不信。",m:"好听的话不真。",detail:"好听的话往往不真实。花言巧语背后，常常藏着目的。",ref:"《道德经》第八十一章"},

/* ===== 道德经 · 处世 ===== */
{s:"道德经",c:"处世",t:"祸兮福之所倚",full:"祸兮福之所倚，福兮祸之所伏。",m:"祸福相依。",detail:"祸患里倚伏着福气，福气里潜藏着祸患。比喻坏事可以引出好结果，好事也可能引出坏结果，二者互相转化。",ref:"《道德经》第五十八章"},
{s:"道德经",c:"处世",t:"福兮祸之所伏",full:"祸兮福之所倚，福兮祸之所伏。",m:"福中潜伏着祸。",detail:"福气里潜藏着祸患。人在顺境时最容易松懈，而祸患往往就在这时埋下。",ref:"《道德经》第五十八章"},
{s:"道德经",c:"处世",t:"大成若缺",full:"大成若缺，其用不弊。",m:"最圆满的看起来有缺口。",detail:"最圆满的东西，看起来好像有欠缺，但它的作用不会败坏。真正的完满，不追求表面的圆满。",ref:"《道德经》第四十五章"},
{s:"道德经",c:"处世",t:"其用不弊",full:"大成若缺，其用不弊。",m:"它的作用不会败坏。",detail:"因为不追求表面的圆满，所以作用不会衰竭。留有余地，才能长久。",ref:"《道德经》第四十五章"},
{s:"道德经",c:"处世",t:"大盈若冲",full:"大盈若冲，其用不穷。",m:"最充盈的看起来是空的。",detail:"最充盈的东西，看起来好像是空的，但它的作用不会穷尽。虚中有实，实中守虚。",ref:"《道德经》第四十五章"},
{s:"道德经",c:"处世",t:"其用不穷",full:"大盈若冲，其用不穷。",m:"它的作用不会穷尽。",detail:"因为保持虚空，所以用之不竭。满则溢，虚则容。",ref:"《道德经》第四十五章"},
{s:"道德经",c:"处世",t:"大直若屈",full:"大直若屈，大巧若拙，大辩若讷。",m:"真正的高明往往以笨拙的面目出现。",detail:"最正直的好像弯曲，最灵巧的好像笨拙，最善辩的好像木讷。真正的高明，往往不露锋芒。",ref:"《道德经》第四十五章"},
{s:"道德经",c:"处世",t:"大巧若拙",full:"大直若屈，大巧若拙，大辩若讷。",m:"真正灵巧的看起来笨拙。",detail:"真正灵巧的人，看起来好像很笨拙。不炫技，不张扬，是大巧的境界。",ref:"《道德经》第四十五章"},
{s:"道德经",c:"处世",t:"大辩若讷",full:"大直若屈，大巧若拙，大辩若讷。",m:"真正善辩的看起来木讷。",detail:"真正善辩的人，看起来好像不善言辞。因为真理不需要靠言辞来装饰。",ref:"《道德经》第四十五章"},
{s:"道德经",c:"处世",t:"善行无辙迹",full:"善行无辙迹，善言无瑕谪。",m:"真正会做事的人不留痕迹。",detail:"真正善于行事的人，不留痕迹；真正善于言谈的人，没有过失。做事不留痕，是最高明的手法。",ref:"《道德经》第二十七章"},
{s:"道德经",c:"处世",t:"善言无瑕谪",full:"善行无辙迹，善言无瑕谪。",m:"真正会说话的人没有过失。",detail:"真正会说话的人，言语没有瑕疵可以指责。不是话说得漂亮，而是说得恰当。",ref:"《道德经》第二十七章"},
{s:"道德经",c:"处世",t:"夫唯不争",full:"夫唯不争，故天下莫能与之争。",m:"正因为不争。",detail:"正因为不与人争，所以天下没有人能争得过他。不争，不是放弃，而是不陷入无谓的争夺。",ref:"《道德经》第二十二章"},
{s:"道德经",c:"处世",t:"故天下莫能与之争",full:"夫唯不争，故天下莫能与之争。",m:"所以天下没人争得过他。",detail:"不争的人，反而没人能与他争。因为他不在争夺的局里。",ref:"《道德经》第二十二章"},
{s:"道德经",c:"处世",t:"飘风不终朝",full:"飘风不终朝，骤雨不终日。",m:"猛烈的东西都不会持久。",detail:"狂风刮不了一个早晨，暴雨下不了一整天。猛烈的东西都不会持久，一切都会过去。",ref:"《道德经》第二十三章"},
{s:"道德经",c:"处世",t:"骤雨不终日",full:"飘风不终朝，骤雨不终日。",m:"暴雨不会下一整天。",detail:"暴雨不会下一整天。越是猛烈，越是短暂。困境如此，情绪也如此。",ref:"《道德经》第二十三章"},
{s:"道德经",c:"处世",t:"知足之足常足矣",full:"知足之足，常足矣。",m:"知足带来的满足，才是永恒的满足。",detail:"懂得满足而得到的满足，才是长久的满足。向外求，永远不够；向内知足，当下即足。",ref:"《道德经》第四十六章"},
{s:"道德经",c:"处世",t:"既以为人己愈有",full:"既以为人，己愈有；既以与人，己愈多。",m:"越给予别人，自己越丰盛。",detail:"越是为别人着想，自己反而越充实；越是给予别人，自己反而越丰富。给予不是失去，而是另一种获得。",ref:"《道德经》第八十一章"},
{s:"道德经",c:"处世",t:"既以与人己愈多",full:"既以为人，己愈有；既以与人，己愈多。",m:"越给予别人，自己越多。",detail:"越是把东西给予别人，自己反而越多。这是老子对“给予”的辩证理解。",ref:"《道德经》第八十一章"},

/* ===== 道德经 · 治国 ===== */
{s:"道德经",c:"治国",t:"治大国若烹小鲜",full:"治大国，若烹小鲜。",m:"治理大国像煎小鱼，别老翻动。",detail:"治理大国，就像煎小鱼一样，不能老是翻动。翻多了鱼就碎。治理要稳，不折腾。",ref:"《道德经》第六十章"},
{s:"道德经",c:"治国",t:"太上下知有之",full:"太上，下知有之。",m:"最高明的领导，大家只知道他在那儿。",detail:"最高明的领导者，百姓只知道有他存在。感觉不到被管，却一切井然。这是老子推崇的无为之治。",ref:"《道德经》第十七章"},
{s:"道德经",c:"治国",t:"我无为而民自化",full:"我无为而民自化，我好静而民自正。",m:"不折腾，百姓自然走上正轨。",detail:"我不妄为，百姓自然归化；我喜好安静，百姓自然端正。统治者不折腾，百姓自然安居乐业。",ref:"《道德经》第五十七章"},
{s:"道德经",c:"治国",t:"我好静而民自正",full:"我无为而民自化，我好静而民自正。",m:"我好静，百姓自然端正。",detail:"统治者好静，百姓自然走上正道。上梁正，下梁自然正。",ref:"《道德经》第五十七章"},
{s:"道德经",c:"治国",t:"祸莫大于不知足",full:"祸莫大于不知足，咎莫大于欲得。",m:"最大的灾祸来自不知足。",detail:"没有比不知足更大的祸患，没有比贪得无厌更大的过错。知足，是避祸的根本。",ref:"《道德经》第四十六章"},
{s:"道德经",c:"治国",t:"咎莫大于欲得",full:"祸莫大于不知足，咎莫大于欲得。",m:"最大的过错来自贪得无厌。",detail:"最大的过错，就是贪得无厌。欲望无止境，灾祸也无止境。",ref:"《道德经》第四十六章"},
{s:"道德经",c:"治国",t:"天之道损有余而补不足",full:"天之道，损有余而补不足。",m:"自然的法则，是削高填低。",detail:"自然的法则，是减少有余的、补充不足的，保持整体平衡。与人之道“损不足以奉有余”正好相反。",ref:"《道德经》第七十七章"},
{s:"道德经",c:"治国",t:"天下之至柔",full:"天下之至柔，驰骋天下之至坚。",m:"天下最柔弱的东西。",detail:"天下最柔弱的东西，能在天下最坚硬的东西中穿行。水能穿石，柔能克刚，是老子反复强调的道理。",ref:"《道德经》第四十三章"},
{s:"道德经",c:"治国",t:"驰骋天下之至坚",full:"天下之至柔，驰骋天下之至坚。",m:"能穿透天下最坚硬的东西。",detail:"最柔弱的东西能穿透最坚硬的东西。看似柔弱，实则无坚不摧。",ref:"《道德经》第四十三章"},
{s:"道德经",c:"治国",t:"天网恢恢",full:"天网恢恢，疏而不失。",m:"天道像大网。",detail:"天道就像一张大网，看起来稀疏，却不会漏掉任何东西。因果不虚，天道不爽。",ref:"《道德经》第七十三章"},
{s:"道德经",c:"治国",t:"疏而不失",full:"天网恢恢，疏而不失。",m:"看似稀疏，什么都不漏。",detail:"天网看似稀疏，却什么都不会漏掉。作恶者或许一时得意，但终究逃不过天道。",ref:"《道德经》第七十三章"},

/* ===== 传习录 · 心即理 ===== */
{s:"传习录",c:"心即理",t:"心外无物",full:"心外无物，心外无事，心外无理。",m:"一切道理不在外面，在你心里。",detail:"一切事物、事情、道理都不在心外，而在于心。这是阳明心学的底层逻辑，也是孟子“万物皆备于我”的极致版。",ref:"《传习录》上卷"},
{s:"传习录",c:"心即理",t:"心外无事",full:"心外无物，心外无事，心外无理。",m:"心外没有事物。",detail:"心外没有独立存在的事物。事物对你的意义，由你的心赋予。",ref:"《传习录》上卷"},
{s:"传习录",c:"心即理",t:"心外无理",full:"心外无物，心外无事，心外无理。",m:"心外没有道理。",detail:"心外没有独立的道理。天理不在典籍里，而在人心中。",ref:"《传习录》上卷"},
{s:"传习录",c:"心即理",t:"尔那一点良知",full:"尔那一点良知，是尔自家底准则。",m:"你心里那个知道对错的东西。",detail:"你心里那一点良知，就是你自己最高的准则。不需要向外找标准，良知本身就是标准。",ref:"《传习录》下卷"},
{s:"传习录",c:"心即理",t:"是尔自家底准则",full:"尔那一点良知，是尔自家底准则。",m:"就是你的最高裁判。",detail:"良知是你自家的准则，不是别人给的。判断是非对错，最终要问自己的良知。",ref:"《传习录》下卷"},
{s:"传习录",c:"心即理",t:"天理在人心",full:"天理在人心，亘古亘今，无有终始。",m:"真理不在典籍里，在人心里。",detail:"天理就在人心中，从古到今一直存在，没有开始也没有结束。真理不是外来的，是本有的。",ref:"《传习录》中卷"},
{s:"传习录",c:"心即理",t:"亘古亘今",full:"天理在人心，亘古亘今，无有终始。",m:"从古到今。",detail:"从古到今，天理一直在人心中，不曾改变。时代会变，人心中的良知不变。",ref:"《传习录》中卷"},
{s:"传习录",c:"心即理",t:"无有终始",full:"天理在人心，亘古亘今，无有终始。",m:"没有终点和起点。",detail:"天理没有起点也没有终点，超越时间。它是人心本有的，不因时代而增减。",ref:"《传习录》中卷"},
{s:"传习录",c:"心即理",t:"至善者心之本体",full:"至善者，心之本体。",m:"你心的本来面目就是至善的。",detail:"至善，就是心的本来面目。不需要向外求善，心的本体本来就是善的。这是老子“见素抱朴”的心学版。",ref:"《传习录》上卷"},

/* ===== 传习录 · 知行合一 ===== */
{s:"传习录",c:"知行合一",t:"知是行的主意",full:"知是行的主意，行是知的功夫；知是行之始，行是知之成。",m:"知道是行动的主意。",detail:"认知是行动的主意，行动是认知的功夫；认知是行动的开始，行动是认知的完成。知与行是一件事的两面。",ref:"《传习录》上卷"},
{s:"传习录",c:"知行合一",t:"行是知的功夫",full:"知是行的主意，行是知的功夫；知是行之始，行是知之成。",m:"行动是知道的功夫。",detail:"行动是认知的落实功夫。没有行动，认知就是空的。",ref:"《传习录》上卷"},
{s:"传习录",c:"知行合一",t:"知是行之始",full:"知是行的主意，行是知的功夫；知是行之始，行是知之成。",m:"知道是行动的开始。",detail:"认知是行动的开始。先有认知，才有行动的方向。",ref:"《传习录》上卷"},
{s:"传习录",c:"知行合一",t:"行是知之成",full:"知是行的主意，行是知的功夫；知是行之始，行是知之成。",m:"行动是知道的完成。",detail:"行动是认知的完成。知道而不做，认知就没有完成。",ref:"《传习录》上卷"},
{s:"传习录",c:"知行合一",t:"一念发动处",full:"一念发动处，便即是行了。",m:"念头起来的那一刻。",detail:"念头一起，就已经是“行”了。所以管住念头，就是管住行为。这比孔子“吾日三省吾身”更往前推了一步。",ref:"《传习录》下卷"},
{s:"传习录",c:"知行合一",t:"便即是行了",full:"一念发动处，便即是行了。",m:"就已经是行了。",detail:"念头发动的那一刻，就已经是行动了。所以修行要从起心动念处下手。",ref:"《传习录》下卷"},
{s:"传习录",c:"知行合一",t:"未有知而不行者",full:"未有知而不行者。知而不行，只是未知。",m:"没有知道却做不到的。",detail:"没有真正知道却做不到的人。你说你知道但做不到？那不是真知道。真知道一定做得到。",ref:"《传习录》上卷"},
{s:"传习录",c:"知行合一",t:"知而不行只是未知",full:"未有知而不行者。知而不行，只是未知。",m:"知道却做不到，只是不知道。",detail:"知道却做不到，说明你并没有真知道。真知必然带来真行。",ref:"《传习录》上卷"},
{s:"传习录",c:"知行合一",t:"人须在事上磨",full:"人须在事上磨，方立得住。",m:"功夫不在静坐空想里。",detail:"人必须在具体事情上磨炼，才能立得住。功夫不在静坐空想里，在事上磨出来。这是孔子“仁远乎哉”的落地版。",ref:"《传习录》下卷"},
{s:"传习录",c:"知行合一",t:"方立得住",full:"人须在事上磨，方立得住。",m:"才能立得住。",detail:"只有在事上磨炼过，功夫才立得住。空想出来的境界，一遇事就垮。",ref:"《传习录》下卷"},
{s:"传习录",c:"知行合一",t:"食味之美恶",full:"食味之美恶，必待入口而后知。",m:"食物味道的好坏。",detail:"食物味道的好坏，必须亲自尝了才知道。道理好不好用，得亲自试了才知道。呼应孔子“习”字。",ref:"《传习录》下卷"},
{s:"传习录",c:"知行合一",t:"必待入口而后知",full:"食味之美恶，必待入口而后知。",m:"得亲自试了才知道。",detail:"必须亲自入口品尝，才知道味道好坏。知行合一，重在亲自实践。",ref:"《传习录》下卷"},

/* ===== 传习录 · 致良知 ===== */
{s:"传习录",c:"致良知",t:"良知只是个是非之心",full:"良知只是个是非之心。",m:"良知就是你知道对错的直觉。",detail:"良知不是什么玄乎的东西，就是你知道这件事对不对的那个直觉。是非之心，人皆有之。",ref:"《传习录》下卷"},
{s:"传习录",c:"致良知",t:"随时就事上致其良知",full:"随时就事上致其良知，便是格物。",m:"遇到什么事，当下凭良知去做。",detail:"遇到什么事，当下凭良知去做，这就是“格物”。把朱熹的“格物”翻了个个儿——不是向外格物，而是向内致良知。",ref:"《传习录》下卷"},
{s:"传习录",c:"致良知",t:"便是格物",full:"随时就事上致其良知，便是格物。",m:"这就是格物。",detail:"在事上致良知，就是格物。格物不是研究外物，而是在事上正心。",ref:"《传习录》下卷"},
{s:"传习录",c:"致良知",t:"良知之在人心",full:"良知之在人心，无间于圣愚。",m:"良知存在于人心中。",detail:"良知存在于每个人心中，圣人和普通人没有区别。区别只在用不用。这是孟子“人皆可以为尧舜”的再确认。",ref:"《传习录》下卷"},
{s:"传习录",c:"致良知",t:"无间于圣愚",full:"良知之在人心，无间于圣愚。",m:"圣人和普通人的良知是一样的。",detail:"圣人与凡夫的良知没有差别。圣人只是把良知用透了，凡夫只是没去用。",ref:"《传习录》下卷"},
{s:"传习录",c:"致良知",t:"不欺良知",full:"不欺良知，圣境可到。",m:"不骗自己心里那个声音。",detail:"不欺骗自己的良知，就能到达圣人的境界。圣境不在远处，就在不欺良知。",ref:"《传习录》下卷"},
{s:"传习录",c:"致良知",t:"圣境可到",full:"不欺良知，圣境可到。",m:"就能到圣人的境界。",detail:"只要不欺良知，圣人的境界就可以达到。成圣的功夫，就在当下不欺良知。",ref:"《传习录》下卷"},
{s:"传习录",c:"致良知",t:"着实致良知",full:"着实致良知，自无暇及此。",m:"真正在致良知上用功。",detail:"真正在致良知上下功夫，那些胡思乱想自然就没有空间了。功夫用得真，杂念自然消。",ref:"《传习录》下卷"},
{s:"传习录",c:"致良知",t:"自无暇及此",full:"着实致良知，自无暇及此。",m:"那些胡思乱想自然没空间了。",detail:"真在致良知上用功，就没有闲工夫去胡思乱想了。不是压制杂念，而是用正念填满。",ref:"《传习录》下卷"},
{s:"传习录",c:"致良知",t:"千思万虑",full:"千思万虑，只是要致良知。",m:"所有的思考。",detail:"千思万虑，最终都指向一件事：让良知做主。思考不是目的，致良知才是。",ref:"《传习录》下卷"},
{s:"传习录",c:"致良知",t:"只是要致良知",full:"千思万虑，只是要致良知。",m:"最终指向让良知做主。",detail:"所有的思考，最终只是要致良知。方向对了，思虑才有意义。",ref:"《传习录》下卷"},

/* ===== 传习录 · 事上磨炼 ===== */
{s:"传习录",c:"事上磨炼",t:"在人情事变上做功夫",full:"在人情事变上做功夫。",m:"人情世故、具体事情，就是你的道场。",detail:"修行不在深山古寺，就在人情世故、具体事情上。每一件事，都是磨炼心性的道场。",ref:"《传习录》下卷"},
{s:"传习录",c:"事上磨炼",t:"悔悟是去病之药",full:"悔悟是去病之药，然以改为贵。",m:"后悔是药。",detail:"悔悟是治病的药，但关键是改。光后悔不改，药就白吃了。",ref:"《传习录》上卷"},
{s:"传习录",c:"事上磨炼",t:"然以改为贵",full:"悔悟是去病之药，然以改为贵。",m:"但关键是改。",detail:"悔悟之后，贵在能改。改了，病才真的去了。",ref:"《传习录》上卷"},
{s:"传习录",c:"事上磨炼",t:"持志如心痛",full:"持志如心痛，一心在痛上，岂有工夫说闲话、管闲事？",m:"志向坚定到像心口在疼。",detail:"持守志向就像心口在痛，一心都在痛上，哪还有工夫说闲话、管闲事？这是孔子“三军可夺帅也，匹夫不可夺志也”的体感版。",ref:"《传习录》上卷"},
{s:"传习录",c:"事上磨炼",t:"一心在痛上",full:"持志如心痛，一心在痛上，岂有工夫说闲话、管闲事？",m:"一心都在痛上。",detail:"一心都在痛上，心无旁骛。志向坚定到这种程度，自然不会被琐事分心。",ref:"《传习录》上卷"},
{s:"传习录",c:"事上磨炼",t:"岂有工夫说闲话",full:"持志如心痛，一心在痛上，岂有工夫说闲话、管闲事？",m:"哪还有空分心。",detail:"心在志上，自然没有工夫说闲话、管闲事。分心，是因为志向不够坚定。",ref:"《传习录》上卷"},
{s:"传习录",c:"事上磨炼",t:"管闲事",full:"持志如心痛，一心在痛上，岂有工夫说闲话、管闲事？",m:"管别人的闲事。",detail:"志向坚定的人，没有闲工夫去管别人的闲事。管闲事，往往是自己的正事没做好。",ref:"《传习录》上卷"},
{s:"传习录",c:"事上磨炼",t:"人须在事上磨炼做功夫",full:"人须在事上磨炼做功夫，乃有益。若只好静，遇事便乱。",m:"光会打坐没用。",detail:"人必须在事上磨炼做功夫，才有益处。如果只喜欢静坐，一遇事就乱。这是老子“躁胜寒，静胜热”的反面提醒。",ref:"《传习录》下卷"},
{s:"传习录",c:"事上磨炼",t:"乃有益",full:"人须在事上磨炼做功夫，乃有益。若只好静，遇事便乱。",m:"才有益处。",detail:"在事上磨炼，功夫才真正有益。空静出来的定，不是真定。",ref:"《传习录》下卷"},
{s:"传习录",c:"事上磨炼",t:"若只好静",full:"人须在事上磨炼做功夫，乃有益。若只好静，遇事便乱。",m:"如果只喜欢静。",detail:"如果只喜欢安静，逃避事务，那只是暂时的平静，不是真功夫。",ref:"《传习录》下卷"},
{s:"传习录",c:"事上磨炼",t:"遇事便乱",full:"人须在事上磨炼做功夫，乃有益。若只好静，遇事便乱。",m:"一遇事就崩。",detail:"只喜欢静的人，一遇到事情就乱了阵脚。真正的定力，是在事上磨出来的。",ref:"《传习录》下卷"},
{s:"传习录",c:"事上磨炼",t:"日间工夫",full:"日间工夫，觉纷扰则静坐，觉懒看书则且看书。",m:"白天的功夫。",detail:"白天的功夫，心乱了就静坐，懒了就逼自己看书。对症下药，不搞一刀切。",ref:"《传习录》下卷"},
{s:"传习录",c:"事上磨炼",t:"觉纷扰则静坐",full:"日间工夫，觉纷扰则静坐，觉懒看书则且看书。",m:"心乱了就静一静。",detail:"觉得心乱纷扰，就静坐一下。静坐是为了让心回归清明，不是为了逃避。",ref:"《传习录》下卷"},
{s:"传习录",c:"事上磨炼",t:"觉懒看书则且看书",full:"日间工夫，觉纷扰则静坐，觉懒看书则且看书。",m:"懒了就逼自己动。",detail:"觉得懒不想看书，就偏偏去看书。用行动对治惰性，是最直接的功夫。",ref:"《传习录》下卷"},

/* ===== 传习录 · 破执 ===== */
{s:"传习录",c:"破执",t:"破山中贼易",full:"破山中贼易，破心中贼难。",m:"外面的敌人好对付。",detail:"打败山里的贼寇容易，破除心中的贼难。外面的敌人好对付，心里的贪嗔痴才是真对手。",ref:"《传习录》下卷"},
{s:"传习录",c:"破执",t:"破心中贼难",full:"破山中贼易，破心中贼难。",m:"心里的贪嗔痴才是真对手。",detail:"破除心中的贼，是最难的。因为心中的贼，就是自己的习气和欲望。",ref:"《传习录》下卷"},
{s:"传习录",c:"破执",t:"你未看此花时",full:"你未看此花时，此花与汝心同归于寂。",m:"你没看花的时候。",detail:"你没看这朵花的时候，花和你的心同样归于寂静。这是阳明对心物关系的著名表述，把老子“有无相生”拉到心物关系上。",ref:"《传习录》下卷"},
{s:"传习录",c:"破执",t:"此花与汝心同归于寂",full:"你未看此花时，此花与汝心同归于寂。",m:"花对你来说不存在。",detail:"你没看花时，花对你来说归于寂静。花的意义，因你的观看而显现。",ref:"《传习录》下卷"},
{s:"传习录",c:"破执",t:"圣人无善无恶",full:"圣人无善无恶，只是无有作好，无有作恶。",m:"圣人不是没有善恶判断。",detail:"圣人不是没有善恶，只是不刻意去“做好人”、不刻意去作恶。不执着于善恶的相，是老子“上德不德”的呼应。",ref:"《传习录》下卷"},
{s:"传习录",c:"破执",t:"只是无有作好",full:"圣人无善无恶，只是无有作好，无有作恶。",m:"只是不刻意去做好人。",detail:"圣人只是不刻意去表现善。刻意行善，反而落入了“为善”的执念。",ref:"《传习录》下卷"},
{s:"传习录",c:"破执",t:"无有作恶",full:"圣人无善无恶，只是无有作好，无有作恶。",m:"不刻意去作恶。",detail:"圣人只是不刻意去作恶。不造作，不刻意，是心学的破执功夫。",ref:"《传习录》下卷"},
{s:"传习录",c:"破执",t:"不须着意",full:"不须着意，只顺其自然。",m:"别用力过猛。",detail:"不需要刻意用力，只顺着良知自然而行。这是老子“道法自然”的心学翻译。",ref:"《传习录》下卷"},
{s:"传习录",c:"破执",t:"只顺其自然",full:"不须着意，只顺其自然。",m:"顺着良知走就行。",detail:"只顺着良知走，自然就是对的。刻意，反而偏离。",ref:"《传习录》下卷"},
{s:"传习录",c:"破执",t:"毁誉荣辱",full:"毁誉荣辱，皆能摇动，只是良知不能欺。",m:"外界的评价。",detail:"外界的毁誉荣辱，都会动摇人心，但良知不能被欺骗。守住良知，就不怕外界风浪。",ref:"《传习录》下卷"},
{s:"传习录",c:"破执",t:"皆能摇动",full:"毁誉荣辱，皆能摇动，只是良知不能欺。",m:"都会动摇你。",detail:"毁誉荣辱都能动摇人。动摇，是因为把外界的评价看得太重。",ref:"《传习录》下卷"},
{s:"传习录",c:"破执",t:"只是良知不能欺",full:"毁誉荣辱，皆能摇动，只是良知不能欺。",m:"但你的良知骗不了自己。",detail:"外界的评价会动摇你，但你的良知骗不了自己。守住良知，就是守住根本。",ref:"《传习录》下卷"},

/* ===== 传习录 · 教育 ===== */
{s:"传习录",c:"教育",t:"大抵童子之情",full:"大抵童子之情，乐嬉游而惮拘检。",m:"小孩的天性。",detail:"大体上小孩的天性，是喜欢嬉戏游玩而害怕拘束。教育要顺着天性来，这是老子“辅万物之自然”的教育版。",ref:"《传习录》中卷"},
{s:"传习录",c:"教育",t:"乐嬉游而惮拘检",full:"大抵童子之情，乐嬉游而惮拘检。",m:"爱玩怕束缚。",detail:"孩子爱玩、怕束缚，是天性。教育不能逆着天性来，要引导，不能压制。",ref:"《传习录》中卷"},
{s:"传习录",c:"教育",t:"与人论学",full:"与人论学，亦须随人分限所及。",m:"和人讨论学问。",detail:"和人讨论学问，也要看对方的水平程度。这是孔子“因材施教”的细化。",ref:"《传习录》中卷"},
{s:"传习录",c:"教育",t:"亦须随人分限所及",full:"与人论学，亦须随人分限所及。",m:"要看对方水平。",detail:"教人要看对方的水平和接受能力，不能一上来就灌最高深的。循序渐进，才有效果。",ref:"《传习录》中卷"},
{s:"传习录",c:"教育",t:"点化人",full:"点化人，也要有来学者才有受用。",m:"点化别人。",detail:"点化别人，得对方自己想学，才有受用。这是孔子“不愤不启，不悱不发”的延续。",ref:"《传习录》下卷"},
{s:"传习录",c:"教育",t:"也要有来学者才有受用",full:"点化人，也要有来学者才有受用。",m:"得自己想学才有用。",detail:"老师点化，学生得有求学之心，才真正受用。没有求学之心，再好的老师也没用。",ref:"《传习录》下卷"},

/* ===== 传习录 · 气象 ===== */
{s:"传习录",c:"气象",t:"此心光明",full:"此心光明，亦复何言。",m:"心是光明的。",detail:"我的心是光明的，还有什么好说的呢？这是王阳明临终遗言。一生致良知，到此问心无愧。是孔子“朝闻道夕死可矣”的终极版。",ref:"《传习录》附录"},
{s:"传习录",c:"气象",t:"亦复何言",full:"此心光明，亦复何言。",m:"没什么好交代的。",detail:"此心光明，不需要再多说什么。一生的功夫，都在这四个字里。",ref:"《传习录》附录"},
{s:"传习录",c:"气象",t:"不离日用常行内",full:"不离日用常行内，直造先天未画前。",m:"最高道理就在日常里。",detail:"最高的道理，就在每天的吃喝拉撒、待人接物里，同时又能直造先天未画之前。把老子“道在屎溺”和孔子“庸德之行”合在一起了。",ref:"《传习录》下卷"},
{s:"传习录",c:"气象",t:"直造先天未画前",full:"不离日用常行内，直造先天未画前。",m:"直达先天未画之前。",detail:"在日用常行中，直达先天未画之前的境界。平常与超越，是一不是二。",ref:"《传习录》下卷"},
];

  "传习录|破执|皆能摇动",
  "传习录|破执|毁誉荣辱",
  "传习录|破执|破山中贼易",
  "传习录|破执|破心中贼难",
  "传习录|破执|不须着意",
  "传习录|破执|只顺其自然",
  "传习录|破执|无有作恶",
  "传习录|破执|只是无有作好",
  "传习录|破执|圣人无善无恶",
  "传习录|破执|你未看此花时",
  "传习录|破执|只是良知不能欺",
  "传习录|破执|此花与汝心同归于寂",
  // 传习录 · 教育（166-171）
  "传习录|教育|点化人",
  "传习录|教育|与人论学",
  "传习录|教育|大抵童子之情",
  "传习录|教育|乐嬉游而惮拘检",
  "传习录|教育|亦须随人分限所及",
  "传习录|教育|也要有来学者才有受用",
  // 传习录 · 气象（172-175）
  "传习录|气象|此心光明",
  "传习录|气象|亦复何言",
  "传习录|气象|不离日用常行内",
  "传习录|气象|直造先天未画前",
];

/* 由 LEVEL_KEYS 构建 LEVELS（永久固定） */
const LEVELS = LEVEL_KEYS.map(key=>{
  const [s, c, t] = key.split("|");
  return DB.find(q=>q.s===s && q.c===c && q.t===t);
}).filter(Boolean);
const TOTAL_LEVELS = LEVELS.length;

/* ================== 干扰字库 ================== */
const DISTRACTORS = "之乎者也矣焉哉德仁义礼智信道德玄妙柔静虚无为空阴阳天地人心中和诚明善恶心性知行功夫良知格物致知诚意正心修身齐家治国平天下温良恭俭让忠孝廉耻勇毅勤俭刚柔宽敏惠";

/* ================== 难度（按关卡位置比例） ================== */
function levelToExtra(lv){
  const ratio = (lv - 1) / Math.max(1, TOTAL_LEVELS - 1);
  if(ratio < 0.4) return 2;
  if(ratio < 0.8) return 5;
  return 8;
}

/* ================== 状态 ================== */
const state = {
  level: 1,
  current: null,
  target: "",
  slots: [],
  tiles: [],
  solved: false,
};

/* ================== 工具 ================== */
const $ = id => document.getElementById(id);
const rand = n => Math.floor(Math.random()*n);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };

function makeDistractors(count){
  const out=[];
  for(let i=0;i<count;i++) out.push(DISTRACTORS[rand(DISTRACTORS.length)]);
  return out;
}

/* ================== 渲染 ================== */
function renderAll(){
  $("lvDisplay").textContent = state.level;
  $("lvTotal").textContent = TOTAL_LEVELS;
  $("lvTotal2").textContent = TOTAL_LEVELS;
  $("lvInput").value = state.level;
  $("lvInput").max = TOTAL_LEVELS;
  $("prevBtn").disabled = state.level <= 1;
  $("nextBtn").disabled = state.level >= TOTAL_LEVELS;
  $("sourceTag").textContent = `《${state.current.s}》· ${state.current.c}`;
  renderAnswer();
  renderPool();
}
function renderAnswer(){
  const area = $("answerArea");
  area.innerHTML = "";
  state.slots.forEach((slot, i)=>{
    const d = document.createElement("div");
    d.className = "slot " + (slot ? "filled" : "empty");
    if(slot){
      d.textContent = slot.char;
      d.onclick = ()=> removeAt(i);
      if(state.solved) d.classList.add("correct");
      if(slot.wrong) d.classList.add("wrong");
    }
    area.appendChild(d);
  });
}
function renderPool(){
  const pool = $("pool");
  pool.innerHTML = "";
  state.tiles.forEach(t=>{
    const d = document.createElement("div");
    d.className = "tile" + (t.used?" used":"");
    d.textContent = t.char;
    d.onclick = ()=> pickTile(t.id);
    pool.appendChild(d);
  });
}

/* ================== 出题 ================== */
function setupQuestion(q){
  state.current = q;
  state.target = q.t;
  state.solved = false;

  const correctChars = state.target.split("");
  const extras = makeDistractors(levelToExtra(state.level));
  const allChars = shuffle([
    ...correctChars.map(c=>({char:c,correct:true})),
    ...extras.map(c=>({char:c,correct:false}))
  ]);
  state.tiles = allChars.map((c,i)=>({id:i, char:c.char, correct:c.correct, used:false}));
  state.slots = correctChars.map(()=>null);

  $("meaning").classList.remove("show");
  $("meaning").innerHTML = "";
  $("toast").textContent = "";
  $("meaningBtn").style.display = "none";

  renderAll();
}

function newRound(){
  const q = LEVELS[state.level - 1];
  setupQuestion(q);
}

function loadQuestion(q){
  const idx = LEVELS.indexOf(q);
  if(idx >= 0) state.level = idx + 1;
  setupQuestion(q);
}

/* ================== 交互 ================== */
function pickTile(id){
  if(state.solved) return;
  const tile = state.tiles.find(t=>t.id===id);
  if(!tile || tile.used) return;
  const idx = state.slots.findIndex(s=>s===null);
  if(idx === -1) return;
  state.slots[idx] = {char: tile.char, tileId: id};
  tile.used = true;
  renderAnswer(); renderPool();
  checkAuto();
}
function removeAt(i){
  if(state.solved) return;
  const slot = state.slots[i];
  if(!slot) return;
  for(let j=i;j<state.slots.length;j++){
    const s = state.slots[j];
    if(s){
      const t = state.tiles.find(t=>t.id===s.tileId);
      if(t) t.used = false;
      state.slots[j] = null;
    }
  }
  renderAnswer(); renderPool();
  $("toast").textContent = "";
}
function checkAuto(){
  if(state.slots.some(s=>s===null)) return;
  const guess = state.slots.map(s=>s.char).join("");
  if(guess === state.target){
    onSolved();
  } else {
    let firstWrong = -1;
    for(let i=0;i<state.target.length;i++){
      if(state.slots[i].char !== state.target[i]){ firstWrong = i; break; }
    }
    state.slots.forEach((s,i)=>{ s.wrong = (i===firstWrong); });
    renderAnswer();
    $("toast").textContent = `第 ${firstWrong+1} 个字不对，再试试`;
  }
}
function onSolved(){
  state.solved = true;
  state.slots.forEach(s=>s.wrong=false);
  renderAnswer();

  const seal = $("seal");
  seal.classList.remove("show");
  void seal.offsetWidth;
  seal.classList.add("show");

  const q = state.current;
  $("meaning").innerHTML = `
    <div class="m-quote">${state.target}</div>
    <div class="m-full"><span class="m-label">完整原文：</span>${q.full||state.target}</div>
    <div class="m-brief"><span class="m-label">释义：</span>${q.m}</div>
    <div class="m-detail"><span class="m-label">详解：</span>${q.detail||""}</div>
    <div class="m-ref"><span class="m-label">出处：</span>${q.ref||""}</div>
  `;
  $("meaning").classList.add("show");
  $("meaningBtn").style.display = "inline-block";
  $("toast").textContent = "";
}

/* ================== 关卡切换 ================== */
function goLevel(lv){
  lv = Math.max(1, Math.min(TOTAL_LEVELS, Math.round(lv)));
  state.level = lv;
  newRound();
}
$("prevBtn").onclick = ()=> goLevel(state.level - 1);
$("nextBtn").onclick = ()=> goLevel(state.level + 1);
$("lvInput").addEventListener("change", e=>{
  const v = parseInt(e.target.value, 10);
  if(!isNaN(v)) goLevel(v);
});
$("lvInput").addEventListener("keydown", e=>{
  if(e.key === "Enter"){ e.target.blur(); }
});

/* ================== 释义按钮 ================== */
$("meaningBtn").onclick = ()=>{
  $("meaning").classList.toggle("show");
};

/* ================== 章节弹窗 ================== */
$("sourceTag").onclick = ()=>{
  const s = state.current.s, c = state.current.c;
  const list = LEVELS.filter(q=>q.s===s && q.c===c);
  $("chapterTitle").textContent = `《${s}》· ${c}`;
  $("chapterList").innerHTML = list.map((q)=>
    `<div class="chapter-item" data-key="${q.t}">
      <div class="c-q">${q.t} <span class="c-lv">第 ${LEVELS.indexOf(q)+1} 关</span></div>
      <div class="c-m">${q.m}</div>
    </div>`
  ).join("") || `<div style="text-align:center;color:#999;padding:20px;">暂无</div>`;
  $("chapterList").querySelectorAll(".chapter-item").forEach(el=>{
    el.onclick = ()=>{
      const key = el.dataset.key;
      const q = LEVELS.find(x=>x.t===key && x.s===s && x.c===c);
      if(q){
        $("chapterModal").classList.remove("show");
        const idx = LEVELS.indexOf(q) + 1;
        goLevel(idx);
      }
    };
  });
  $("chapterModal").classList.add("show");
};
$("closeChapter").onclick = ()=> $("chapterModal").classList.remove("show");
$("chapterModal").onclick = (e)=>{ if(e.target === $("chapterModal")) $("chapterModal").classList.remove("show"); };
$("backToLevel").onclick = ()=>{
  $("chapterModal").classList.remove("show");
  newRound();
};

/* ================== 启动 ================== */
newRound();
</script>
</body>
</html>
